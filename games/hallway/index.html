<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Hallway test</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
        <style>
            html,
            body {
                margin: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                background: #000;
                font-family: Arial, sans-serif;
            }

            a {
                color: white;
            }

            canvas {
                display: block;
                width: 100vw;
                height: 100vh;
            }

            .hud {
                position: fixed;
                top: 10px;
                left: 10px;
                z-index: 10;
                display: flex;
                gap: 12px;
                align-items: center;
                padding: 8px 10px;
                color: #fff;
                background: rgba(0, 0, 0, 0.45);
                border: 1px solid rgba(255, 255, 255, 0.25);
                border-radius: 8px;
                user-select: none;
            }

            .hud select {
                background: #111;
                color: #fff;
                border: 1px solid #444;
                border-radius: 4px;
                padding: 3px 6px;
            }

            .hud button {
                background: #222;
                color: #fff;
                border: 1px solid #555;
                border-radius: 4px;
                padding: 4px 10px;
                cursor: pointer;
                font-size: 12px;
                transition: background 0.15s;
            }

            .hud button:hover {
                background: #333;
            }

            .stats {
                display: flex;
                gap: 14px;
                flex-wrap: wrap;
                align-items: center;
            }

            .stat-item {
                font-size: 13px;
                white-space: nowrap;
            }

            .stat-label {
                color: #aaa;
                margin-right: 3px;
            }

            .stat-value {
                color: #0f0;
                font-weight: bold;
                font-family: 'Courier New', monospace;
            }
        </style>
    </head>
    <body>
        <div class="hud">
            <div class="stats">
                <div class="stat-item"><span class="stat-label">FPS:</span><span class="stat-value" id="fps">--</span></div>
                <div class="stat-item"><span class="stat-label">Avg:</span><span class="stat-value" id="fpsAvg">--</span></div>
                <div class="stat-item"><span class="stat-label">High:</span><span class="stat-value" id="fpsHigh">--</span></div>
                <div class="stat-item"><span class="stat-label">Low:</span><span class="stat-value" id="fpsLow">--</span></div>
                <div class="stat-item"><span class="stat-label">1% Low:</span><span class="stat-value" id="fps1Low">--</span></div>
            </div>
            <label for="resolution">Resolution:</label>
            <select id="resolution" aria-label="Render resolution">
                <option value="native" selected>Native (Browser Size)</option>
                <option value="2560x1440">2560x1440</option>
                <option value="1920x1080">1920x1080</option>
                <option value="1600x900">1600x900</option>
                <option value="1280x720">1280x720</option>
                <option value="960x540">960x540</option>
            </select>
            <button id="resetStats">Reset Stats</button>
            <a href="https://github.com/RobertFlexx">Shader by RobertFlexx</a>
        </div>
        <canvas id="c"></canvas>
        <script src="main.js"></script>
    </body>
</html>
