<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KKNC - Contact Me</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1 class="medtext" style="margin-top: 0; margin-bottom: 0;">Say <span class="glassy">Hi</span></h1>
        <h2 style="margin-top: 0; margin-bottom: 0;">(or don't, I won't be offended, don't worry)</h2>
        <p>If you would like to contact me for a job, chat about random stuff, or want a friend, you can reach me through any of the following methods:</p>
    </header>
    <main>
        <div class="container">
            <div class="button_outer">
                <a href="mailto:contact@kokonico.me" class="a_button">
                    <p>Mail</p>
                    <div class="button_inner">
                        <img src="arrow.svg" alt="arrow" width="50px" height="50px">
                        <p class="subtext">👋</p>
                    </div>
                </a>
            </div>
            <div class="button_outer">
                <a href="https://fosstodon.org/@Kokonico" class="a_button">
                    <p>Mastodon</p>
                    <div class="button_inner">
                        <img src="arrow.svg" alt="arrow" width="50px" height="50px">
                        <p class="subtext">🐘</p>
                    </div>
                </a>
            </div>
            <div class="button_outer">
                <a href="https://discordapp.com/users/1200907560534945842" class="a_button">
                    <p>Discord</p>
                    <div class="button_inner">
                        <img src="arrow.svg" alt="arrow" width="50px" height="50px">
                        <p class="subtext">💬</p>
                    </div>
                </a>
            </div>
        </div>
    </main>
</body>
<script src="footer.js"></script>
<script src="header.js"></script>
<script src="colorful.js"></script>
</html>
